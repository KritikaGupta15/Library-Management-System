{% if user.is_authenticated %}
    <h2>Welcome, {{ user.username }}! 👋</h2>
    <p>Email: {{ user.email }}</p>
    <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
{% else %}
    <h2>Login or Sign Up</h2>
    <div class="row">
        <div class="col-md-6">
            <h3>Login</h3>
            <form method="POST" action="{% url 'login' %}" class="shadow p-4 bg-light rounded">
                {% csrf_token %}
                {{ login_form.as_p }}
                <button type="submit" name="login_submit" class="btn btn-primary">Login</button>
            </form>
        </div>
        <div class="col-md-6">
            <h3>Sign Up</h3>
            <form method="POST" action="{% url 'signup' %}" class="shadow p-4 bg-light rounded">
                {% csrf_token %}
                {{ signup_form.as_p }}
                <button type="submit" name="signup_submit" class="btn btn-success">Sign Up</button>
            </form>
        </div>
    </div>
{% endif %}
