{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">✏️ Edit Book: {{ book.book_name }}</h2>
    <div class="card shadow p-4">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">💾 Save Changes</button>
            <a href="{% url 'home' %}" class="btn btn-secondary">↩️ Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
